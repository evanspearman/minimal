[package]
name = "onboarding"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Terminal dimensions for `show`, and the picker's key events. ratatui
# re-exports crossterm, but the dependency is direct because this crate drives
# the event loop itself.
crossterm.workspace = true
ratatui.workspace = true
version.workspace = true

# The VM resource policy — vcpu ceiling, RAM floor, boot defaults, and the
# x86_64 MMIO-hole hazard — belongs to the daemon that boots the VM, so the
# resource screen reads it from there instead of keeping a second copy that can
# drift. default-features = false drops the `libkrun` feature exactly as the
# `minimal` CLI does: no krun code is called here, so the binary must not
# inherit libkrun's `#[link]` load command.
minvmd = { path = "../minvmd", default-features = false }
